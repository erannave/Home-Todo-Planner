<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Todo Planner">
  <defs>
    <linearGradient id="tp-bg" x1="48" y1="16" x2="464" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="tp-sheen" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tp-check" x1="120" y1="136" x2="176" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="tp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="116" fill="url(#tp-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#tp-sheen)"/>

  <!-- Checklist card -->
  <g filter="url(#tp-shadow)">
    <rect x="72" y="88" width="368" height="336" rx="52" fill="#ffffff"/>
  </g>

  <!-- Row 1 — completed -->
  <rect x="120" y="136" width="56" height="56" rx="16" fill="url(#tp-check)"/>
  <path d="M134 164l10 10 20-21" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="200" y="152" width="192" height="24" rx="12" fill="#c7d2fe"/>

  <!-- Row 2 -->
  <rect x="120" y="228" width="56" height="56" rx="16" fill="#eef2f7"/>
  <rect x="200" y="244" width="192" height="24" rx="12" fill="#e2e8f0"/>

  <!-- Row 3 -->
  <rect x="120" y="320" width="56" height="56" rx="16" fill="#eef2f7"/>
  <rect x="200" y="336" width="132" height="24" rx="12" fill="#e2e8f0"/>
</svg>
